name: Security Audit

on:
  push:
    branches: [main, feature/testes-e-seguranca]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=moderate
